<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-mm="" style="font-family: 'DM Sans', system-ui, sans-serif;">
  <button onClick="{{ openMenu }}" aria-label="Open menu" aria-expanded="{{ open }}" aria-controls="lumi-mobile-menu" style="position: {{ trigPos }}; z-index: 61; top: {{ trigTop }}; left: 12px; width: 48px; height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 0; cursor: pointer; border-radius: 999px; background: {{ trigBg }}; box-shadow: {{ trigShadow }}; transition: background .3s ease, box-shadow .3s ease;">
    <span aria-hidden="true" style="display: block; width: 22px; height: 2px; background: {{ ink }}; transition: background .3s ease;"></span>
    <span aria-hidden="true" style="display: block; width: 22px; height: 2px; background: {{ ink }}; transition: background .3s ease;"></span>
    <span aria-hidden="true" style="display: block; width: 14px; height: 2px; margin-right: 8px; background: {{ ink }}; transition: background .3s ease;"></span>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div id="lumi-mobile-menu" role="dialog" aria-modal="true" aria-label="Menu" onKeyDown="{{ onKey }}" style="position: fixed; inset: 0; z-index: 400; background: #FDFCF8; color: #3F4633; display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch;">
      <div style="position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; padding: 10px 12px; background: #FDFCF8; border-bottom: 1px solid #E8DDD4;">
        <button data-mmclose="" onClick="{{ closeMenu }}" aria-label="Close menu" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; background: none; cursor: pointer; font-size: 30px; line-height: 1; color: #3F4633;">×</button>
        <a href="{{ homeHref }}" onClick="{{ closeMenu }}" aria-label="LUMI home" style="justify-self: center; display: block;"><img src="assets/lumi-logo.png" alt="LUMI" width="1141" height="365" style="display: block; height: 26px; width: auto;" /></a>
        <span></span>
      </div>
      <div style="padding: 18px 20px 8px;">
        <a href="{{ searchHref }}" onClick="{{ closeMenu }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border: 1.5px solid #C5B7AB; background: #F6F2EA; text-decoration: none; color: #6B7258; font-size: 15px;">
          <span aria-hidden="true" style="position: relative; display: block; width: 14px; height: 14px; border: 2px solid #3F4633; border-radius: 50%;"><span style="position: absolute; right: -6px; bottom: -5px; width: 7px; height: 2px; background: #3F4633; transform: rotate(45deg);"></span></span>
          Search tanks, brooches, charms
        </a>
      </div>
      <nav aria-label="Mobile" style="padding: 8px 20px 28px; display: flex; flex-direction: column; gap: 26px;">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
          <div>
            <h2 style="margin: 0 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .2em; color: #6B7258;">{{ g.title }}</h2>
            <ul style="list-style: none; margin: 0; padding: 0;">
              <sc-for list="{{ g.links }}" as="l" hint-placeholder-count="3">
                <li style="border-bottom: 1px solid #E8DDD4;">
                  <a href="{{ l.href }}" onClick="{{ closeMenu }}" style="display: flex; align-items: center; justify-content: space-between; min-height: 54px; text-decoration: none; color: #3F4633; font-family: {{ g.font }}; font-weight: {{ g.weight }}; font-size: {{ g.size }};">
                    <span>{{ l.label }}</span><span aria-hidden="true" style="font-family: 'DM Sans', sans-serif; font-size: 16px; color: #6B7258;">→</span>
                  </a>
                </li>
              </sc-for>
            </ul>
          </div>
        </sc-for>
      </nav>
      <div style="margin-top: auto; padding: 20px; background: #3F4633; color: #FDFCF8; display: flex; justify-content: space-between; align-items: center; gap: 12px;">
        <span style="font-family: 'Fraunces', serif; font-weight: 600; font-style: italic; font-size: 20px;">Make it yours.</span>
        <a href="https://instagram.com/getlumi.in" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 44px; color: #EFCFCB; text-decoration: none; font-size: 14px; font-weight: 700;">@getlumi.in</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:760},&quot;base&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;LUMI-Pages.dc.html#/&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;home&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;LUMI%20Hero%20v2.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fixed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ink&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FDFCF8&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, scrolled: false, sy: 0 };
  componentDidMount() {
    this.onScroll = () => { const s = window.scrollY > window.innerHeight * 0.85, off = this.props.topOffset || 0, sy = Math.min(off, Math.round(window.scrollY)); if (s !== this.state.scrolled || sy !== this.state.sy) this.setState({ scrolled: s, sy }); };
    window.addEventListener("scroll", this.onScroll, { passive: true }); this.onScroll();
  }
  componentWillUnmount() { window.removeEventListener("scroll", this.onScroll); document.body.style.overflow = ""; }
  setOpen(v) {
    this.setState({ open: v }); document.body.style.overflow = v ? "hidden" : "";
    if (v) setTimeout(() => { const b = document.querySelector("[data-mmclose]"); b && b.focus(); }, 30);
  }
  renderVals() {
    const p = this.props, base = p.base ?? "LUMI-Pages.dc.html#/", home = p.home ?? "LUMI%20Hero%20v2.dc.html", onHome = home.startsWith("#");
    const H = id => (onHome ? "" : home) + "#" + id, P = r => base + r;
    const fixed = !!p.fixed, dark = fixed && !this.state.scrolled;
    const serif = { font: "'Fraunces', serif", weight: "600", size: "24px" }, sans = { font: "'DM Sans', sans-serif", weight: "500", size: "17px" };
    return {
      open: this.state.open, openMenu: () => this.setOpen(true), closeMenu: () => this.setOpen(false),
      onKey: e => { if (e.key === "Escape") this.setOpen(false); },
      trigPos: fixed ? "fixed" : "relative", trigTop: fixed ? (12 + (p.topOffset || 0) - this.state.sy) + "px" : "0px", trigBg: fixed && this.state.scrolled ? "#FDFCF8" : "transparent",
      trigShadow: fixed && this.state.scrolled ? "0 8px 24px rgba(22,24,18,.18)" : "none", ink: dark ? (p.ink ?? "#FDFCF8") : "#3F4633",
      homeHref: onHome ? "#top" : home, searchHref: P("shop"),
      groups: [
        Object.assign({ title: "SHOP", links: [{ label: "All Products", href: P("shop") }, { label: "Tank Tops", href: P("tank-tops") }, { label: "Brooches", href: P("brooches") }, { label: "Bag Charms", href: P("bag-charms") }] }, serif),
        Object.assign({ title: "LUMI", links: [{ label: "About LUMI", href: H("top") }, { label: "LUMI IRL", href: H("irl") }, { label: "Our Craft", href: H("closer") }] }, sans),
        Object.assign({ title: "HELP", links: [{ label: "FAQs", href: P("faq") }, { label: "Shipping", href: P("shipping") }, { label: "Returns", href: P("returns") }, { label: "Contact", href: P("contact") }] }, sans),
        Object.assign({ title: "ORDER", links: [{ label: "Track Order", href: P("track-order") }, { label: "The LUMI Bag", href: "LUMI-Checkout.dc.html#/bag" }] }, sans)
      ]
    };
  }
}
</script>
</body>
</html>
