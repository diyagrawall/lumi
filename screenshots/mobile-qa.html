<body>

<iframe id="c320" style="width:320px" src="../LUMI-Checkout.dc.html#/checkout"></iframe>
<script>
window.qa = function (id) {
  const w = document.getElementById(id).contentWindow, d = w.document, vw = d.documentElement.clientWidth, over = [], small = [];
  d.querySelectorAll('body *').forEach(el => {
    const r = el.getBoundingClientRect(); if (!r.width || !r.height) return;
    const cs = w.getComputedStyle(el); if (cs.visibility === 'hidden' || cs.display === 'none') return;
    if (r.right > vw + 2 || r.left < -2) {
      let p = el.parentElement, clipped = false;
      while (p && p !== d.body) { const pc = w.getComputedStyle(p); if (/(hidden|clip|auto|scroll)/.test(pc.overflowX)) { const pr = p.getBoundingClientRect(); if (pr.right <= vw + 2 && pr.left >= -2) { clipped = true; break; } } p = p.parentElement; }
      if (!clipped && !/^(CANVAS)$/.test(el.tagName)) over.push((el.closest('section,header,footer,aside,main')?.id || el.closest('section,header,footer,aside,main')?.tagName || '?') + '|' + el.tagName + '|' + (el.textContent || '').trim().slice(0, 24) + '|' + Math.round(r.left) + '→' + Math.round(r.right));
    }
    if (el.matches('a,button,select,input:not([type=radio]):not([type=checkbox])') && (r.height < 40) && cs.opacity !== '0') small.push((el.closest('section,header,footer,aside,main')?.id || '?') + '|' + el.tagName + '|' + ((el.textContent || el.getAttribute('aria-label') || '').trim().slice(0, 20)) + '|' + Math.round(r.width) + 'x' + Math.round(r.height));
  });
  return { vw, sw: d.documentElement.scrollWidth, over: [...new Set(over)].slice(0, 12), small: [...new Set(small)].slice(0, 25) };
};
</script>
</body></html>
