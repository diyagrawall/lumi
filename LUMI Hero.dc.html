  ::selection { background: #EFCFCB; color: #3F4633; }
  @keyframes lumiUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  @keyframes lumiIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes lumiGem { 0%,100% { transform: rotate(45deg) scale(.85); } 50% { transform: rotate(45deg) scale(1.15); } }

    [data-model] { left: 0 !important; right: 0 !important; width: auto !important; top: 64px !important; bottom: 36% !important; }

<script type="text/x-dc" data-dc-script data-props="{&quot;beadDensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:1.6,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Beads&quot;},&quot;formDelay&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4.2,&quot;min&quot;:1.5,&quot;max&quot;:9,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Beads&quot;},&quot;ghostWordmark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Beads&quot;}}">
const C = { forest: "#3F4633", sage: "#6B7258", paleSage: "#A3A88F", mist: "#CDD1BF", rose: "#D4A7A5", deepRose: "#A5676A", dusty: "#BF8C8A", blush: "#EFCFCB", ivory: "#FDFCF8" };
const LETTER_MIX = [[C.forest, 24], [C.sage, 18], [C.deepRose, 22], [C.dusty, 14], [C.rose, 12], [C.paleSage, 6], [C.blush, 4]];
const FREE_MIX = [[C.rose, 20], [C.blush, 18], [C.sage, 16], [C.paleSage, 14], [C.forest, 10], [C.ivory, 10], [C.deepRose, 8], [C.mist, 6]];
const FAR_MIX = [[C.blush, 30], [C.rose, 20], [C.mist, 22], [C.paleSage, 18], [C.ivory, 10]];
const pick = mix => { const t = mix.reduce((a, m) => a + m[1], 0); let r = Math.random() * t; for (const m of mix) { r -= m[1]; if (r <= 0) return m[0]; } return mix[0][0]; };
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const mixC = (h, t, p) => { const a = hex(h), b = t === "w" ? [255, 255, 255] : [20, 22, 16]; return "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * p)).join(",") + ")"; };
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);

class Sprites {
  constructor() { this.cache = new Map(); }
  get(color, blur) {
    const k = color + blur; if (this.cache.has(k)) return this.cache.get(k);
    const S = 64, pad = blur ? 12 : 2, c = document.createElement("canvas"); c.width = c.height = S + pad * 2;
    const x = c.getContext("2d"), cx = S / 2 + pad, r = S / 2 - 1;
    if (blur) x.filter = "blur(" + blur + "px)";
    const g = x.createRadialGradient(cx - r * .38, cy(cx) - r * .42, r * .05, cx, cx, r);
    g.addColorStop(0, mixC(color, "w", .7)); g.addColorStop(.28, mixC(color, "w", .18)); g.addColorStop(.7, color); g.addColorStop(1, mixC(color, "k", .32));
    x.fillStyle = g; x.beginPath(); x.arc(cx, cx, r, 0, 6.2832); x.fill();
    x.fillStyle = "rgba(255,255,255,.9)"; x.beginPath(); x.ellipse(cx - r * .36, cx - r * .42, r * .16, r * .11, -0.6, 0, 6.2832); x.fill();
    x.strokeStyle = "rgba(255,255,255,.28)"; x.lineWidth = r * .08; x.beginPath(); x.arc(cx, cx, r * .82, 0.4, 1.5); x.stroke();
    const o = { c, pad, S, hole: mixC(color, "k", .45) }; this.cache.set(k, o); return o;
    function cy(v) { return v; }
  }
}

class LumiField {
  constructor(opts) {
    this.o = Object.assign({ density: 1, formAt: 4.2, ghost: true }, opts);
    this.sp = new Sprites(); this.t = 0; this.px = -9999; this.py = -9999; this.pvx = 0; this.pvy = 0; this.inside = false;
    this.far = []; this.mid = []; this.near = []; this.running = false; this.ghostA = 0;
    this.reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.loop = this.loop.bind(this);
  }
  mount(host, far, mid, near) {
    this.host = host; this.cv = { far, mid, near };

    this.ro = new ResizeObserver(() => this.resize(false)); this.ro.observe(host);
    this.io = new IntersectionObserver(([e]) => { this.vis = e.isIntersecting; this.vis ? this.start() : this.stop(); }); this.io.observe(host);
  }
  destroy() { this.stop(); this.ro && this.ro.disconnect(); this.io && this.io.disconnect(); }
  resize(first) {
    const r = this.host.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
    const changed = !this.w || Math.abs(r.width - this.w) > 60 || Math.abs(r.height - this.h) > 120;
    this.w = r.width; this.h = r.height; this.small = this.w < 760; this.dpr = d;
    Object.values(this.cv).forEach(c => { c.width = Math.round(this.w * d); c.height = Math.round(this.h * d); c.getContext("2d").setTransform(d, 0, 0, d, 0, 0); });
    if (first || changed) this.build();
  }
  layout() {
    const w = this.w, h = this.h, s = this.small;
    const fs0 = 100, spacing = .1;
    const ctx = document.createElement("canvas").getContext("2d");
    ctx.font = "500 " + fs0 + "px 'Bodoni Moda', serif";
    const letters = ["L", "U", "M", "I"], ws = letters.map(l => ctx.measureText(l).width);
    const total0 = ws.reduce((a, b) => a + b, 0) + fs0 * spacing * 3;
    let fs = (s ? w * .88 : w * .64) / total0 * fs0;
    const cr = this.copyRect ? this.copyRect() : null, top = 84, bottom = cr ? cr.top - (s ? 18 : 28) : h * .7;
    fs = Math.min(fs, h * (s ? .26 : .36), Math.max(60, (bottom - top) / .78));
    const cy = Math.min(s ? h * .36 : h * .47, bottom - fs * .42);
    return { fs, spacing, letters, ws: ws.map(v => v * fs / fs0), total: total0 * fs / fs0, cy };
  }
  sample(L) {
    const w = Math.ceil(this.w), h = Math.ceil(this.h), c = document.createElement("canvas"); c.width = w; c.height = h;
    const x = c.getContext("2d");
    x.font = "500 " + L.fs + "px 'Bodoni Moda', serif"; x.textBaseline = "alphabetic"; x.fillStyle = "#000"; x.strokeStyle = "#000";
    const step = Math.max(this.small ? 6.5 : 7.5, L.fs * (this.small ? .052 : .034) / Math.sqrt(this.o.density));
    x.lineWidth = step * 1.35; x.lineJoin = "round";
    let cx = (this.w - L.total) / 2; const base = L.cy + L.fs * .34; const boxes = [];
    this.ghost = { font: x.font, items: [] };
    L.letters.forEach((ch, i) => { x.fillText(ch, cx, base); x.strokeText(ch, cx, base); this.ghost.items.push([ch, cx, base]); boxes.push([cx, cx + L.ws[i]]); cx += L.ws[i] + L.fs * L.spacing; });
    const data = x.getImageData(0, 0, w, h).data, pts = [];
    const rowH = step * .866;
    for (let yy = 0, row = 0; yy < h; yy += rowH, row++) {
      for (let xx = (row % 2) * step / 2; xx < w; xx += step) {
        const X = Math.round(xx), Y = Math.round(yy);
        if (data[(Y * w + X) * 4 + 3] > 128) {
          let li = boxes.findIndex(b => X >= b[0] - step && X <= b[1] + step); if (li < 0) li = 0;
          pts.push({ x: xx + (Math.random() - .5) * step * .18, y: yy + (Math.random() - .5) * step * .18, li });
        }
      }
    }
    this.step = step; return pts;
  }
  bead(o) {
    return Object.assign({ x: 0, y: 0, vx: 0, vy: 0, r: 4, ph: Math.random() * 6.28, rot: Math.random() * 6.28, a: 1, spark: Math.random() < .05, mode: "float", attract: Math.random() < .16 }, o);
  }
  build() {
    const w = this.w, h = this.h, s = this.small, D = this.o.density * (s ? .5 : 1);
    this.L = this.layout();
    const pts = this.sample(this.L);
    const rnd = (a, b) => a + Math.random() * (b - a);
    const scatterPos = () => {
      let x, y, tries = 0;
      const cr = this.copyRect ? this.copyRect() : null;
      do { x = rnd(0, w); y = rnd(70, h - 10); tries++; } while (tries < 8 && cr && x > cr.left - 20 && x < cr.right + 20 && y > cr.top - 20);
      return [x, y];
    };
    this.mid = pts.map(p => { const [x, y] = scatterPos(); const r = this.step * rnd(.4, .52); const col = pick(LETTER_MIX);
      return this.bead({ x, y, tx: p.x, ty: p.y, li: p.li, r, m: r * r, col, form: true, delay: this.o.formAt + p.li * .32 + Math.random() * 1.1 + (p.x / w) * .25 }); });
    const nFree = Math.round(150 * D);
    for (let i = 0; i < nFree; i++) { const [x, y] = scatterPos(); const r = rnd(2.5, s ? 7 : 9.5); this.mid.push(this.bead({ x, y, r, m: r * r, col: pick(FREE_MIX), form: false })); }
    this.far = []; for (let i = 0; i < Math.round(130 * D); i++) { const z = rnd(.15, .5); this.far.push(this.bead({ x: rnd(0, w), y: rnd(0, h), r: rnd(1.4, 4) * (s ? .8 : 1), z, a: rnd(.35, .75), col: pick(FAR_MIX), blur: Math.random() < .5 ? 2 : 0 })); }
    this.near = []; for (let i = 0; i < Math.round((s ? 6 : 11) * this.o.density); i++) {
      const cr = this.copyRect ? this.copyRect() : { top: h * .6 }; const right = Math.random() < .65;
      const x = right ? rnd(w * .82, w + 20) : rnd(-20, w * .3), y = right ? rnd(90, h * .62) : rnd(80, Math.max(100, cr.top - 60));
      this.near.push(this.bead({ x, y, r: rnd(12, s ? 18 : 26), z: rnd(1.4, 2), a: rnd(.7, .92), col: pick([[C.rose, 3], [C.blush, 2], [C.sage, 2], [C.forest, 1], [C.deepRose, 2]]), blur: 5 }));
    }
    this.t = 0; this.drops = []; let tt = 1.3, gap = 1.0;
    for (let i = 0; i < 46; i++) { this.drops.push(tt); tt += gap; gap = Math.max(.12, gap * .8); }
    this.nextDrop = 0; this.ghostA = 0; this.recycleT = 0;
    if (this.reduced) { this.mid.forEach(b => { if (b.form) { b.x = b.tx; b.y = b.ty; b.mode = "home"; } }); this.ghostA = this.o.ghost ? .1 : 0; this.draw(); }
    else if (!this.running) this.draw();
  }
  replay() { if (!this.w) return; this.build(); this.start(); }
  pointer(x, y) {
    if (this.inside) { this.pvx = this.pvx * .6 + (x - this.px) * .4; this.pvy = this.pvy * .6 + (y - this.py) * .4; } else { this.pvx = this.pvy = 0; }
    this.px = x; this.py = y; this.inside = true; this.nx = x / this.w - .5; this.ny = y / this.h - .5;
  }
  leave() { this.inside = false; this.nx = 0; this.ny = 0; }
  burst(x, y, power) {
    this.mid.forEach(b => { const dx = b.x - x, dy = b.y - y, d = Math.hypot(dx, dy) || 1; if (d < 260) { const f = (1 - d / 260) * (power || 700); b.vx += dx / d * f; b.vy += dy / d * f; if (b.mode === "float" && !b.form && Math.random() < .3) b.mode = "fall"; } });

  }
  start() { if (this.running || this.reduced || this.vis === false) return; this.running = true; this.last = performance.now(); requestAnimationFrame(this.loop); }
  stop() { this.running = false; }
  loop(now) {
    if (!this.running) return;
    const dt = Math.min((now - this.last) / 1000, 1 / 30); this.last = now;
    this.step_(dt); this.draw(); requestAnimationFrame(this.loop);
  }
  step_(dt) {
    const w = this.w, h = this.h, t = (this.t += dt), M = this.mid;
    while (this.nextDrop < this.drops.length && t >= this.drops[this.nextDrop]) {
      this.nextDrop++;
      const cand = M.filter(b => !b.form && b.mode === "float" && b.y < h * .6);
      if (cand.length) {
        let b = cand[Math.floor(Math.random() * cand.length)];
        if (this.nextDrop === 1) { b = cand.reduce((a, c) => (Math.abs(c.x - w * .5) + c.y * .5 < Math.abs(a.x - w * .5) + a.y * .5 ? c : a)); b.r = Math.max(b.r, 8); b.m = b.r * b.r; }

      }

    if (this.recycleT > 1.6 && this.nextDrop >= this.drops.length) {

      const rest = M.filter(b => b.mode === "fall" && b.rest);
      if (rest.length > 34) { const b = rest[0]; b.mode = "float"; b.x = Math.random() * w; b.y = 80 + Math.random() * h * .4; b.vx = b.vy = 0; b.a = 0; }
      const fl = M.filter(b => b.mode === "float" && !b.form && b.y < h * .5); if (fl.length) fl[Math.floor(Math.random() * fl.length)].mode = "fall";
    }
    const R = this.small ? 90 : 130, g = this.small ? 520 : 620;
    for (const b of M) {
      if (b.a < 1) b.a = Math.min(1, b.a + dt * .8);
      if (b.form && b.mode === "float" && t >= b.delay) { b.mode = "home"; b.t0 = t; }
      if (b.mode === "float") {
        b.ph += dt * .5; b.vx += Math.cos(b.ph) * 5 * dt; b.vy += Math.sin(b.ph * 1.3) * 5 * dt; b.vx *= .96; b.vy *= .96;
      } else if (b.mode === "fall") {
        b.vy += g * dt; b.vx *= .995;
